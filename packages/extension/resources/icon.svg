<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    SandForge Marketplace mark — the forge's fire rising out of a sandbox.

    The name, drawn: an open box in perspective (the sandbox) with a flame
    standing in it (the forge). The crucible it replaces said "fire in a
    vessel" and nothing about a sandbox, and its gradients and halo blurred
    into one blot at the 42 px search thumbnail, where this mark has to read.

    Flat tones only, three of them per mass: the flame in gold with a paler
    core, the box in two steel faces lit from the right, a pale rim where the
    mouth turns. Paint order makes the depth: the box's inside first, then the
    flame, then the two front faces over the flame's foot, so the fire stands
    inside the box rather than in front of it.

    The ground stays a full rounded tile: the Marketplace does not reliably
    round the listing thumbnail, so the mark carries its own radius.

    The same mark, on a square ground, is assets/brand/sandforge-logo-square.svg.
    Regenerate the PNG with `node scripts/render-icon.mjs`.
  -->
  <rect width="256" height="256" rx="56" fill="#14141E"/>
  <g transform="translate(23 25) scale(2.1)">
    <path d="M50 56 L80 68 L50 80 L20 68 Z" fill="#262A3D"/>
    <g transform="translate(0 -9)">
      <path d="M50 12 C57.5 26 74 35 74 56.5 C74 71.5 63.2 82 50 82 C36.8 82 26 71.5 26 56.5
               C26 45 32.4 38.4 37.8 31 C38.8 40 42.4 44.6 46 43.8 C49.6 43 46.6 25.6 50 12 Z"
            fill="#F5A623"/>
      <path d="M50 47 C54.6 55.4 61.6 59.4 61.6 68 C61.6 75.4 56.4 80.6 50 80.6 C43.6 80.6
               38.4 75.4 38.4 68 C38.4 62.2 42 58.6 45 55.2 C45.8 59 47.4 60.6 48.8 60
               C50.4 59.4 49 52.8 50 47 Z"
            fill="#FFD27A"/>
    </g>
    <path d="M20 68 L50 80 L50 95 L20 83 Z" fill="#646E8C"/>
    <path d="M80 68 L50 80 L50 95 L80 83 Z" fill="#8F99B6"/>
    <path d="M20 68 L50 80 L80 68" fill="none" stroke="#C9D0E2" stroke-width="1.6"
          stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
