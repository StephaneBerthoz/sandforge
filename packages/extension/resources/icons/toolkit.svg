<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
  <!--
    SandForge activity-bar mark — anvil, single mass.

    Deliberately WITHOUT the strike spark that the Marketplace mark carries.
    Rendered side by side at 20 px, the two-shape version turns the spark into
    an indistinct blob and crowds the silhouette; the anvil alone stays legible.
    A 20 px slot affords one idea, and the anvil is the one.

    Construction (grid units):
      ink      x 2.4 -> 21.0 (18.6 wide), y 5.6 -> 18.4 (12.8 tall)
      padding  L 2.4  R 3.0  T 5.6  B 5.6
      centre   h 11.7 / v 12.0 — the 0.3 left bias is deliberate: the horn
               carries less visual mass than the base, so geometric centring
               reads as leaning right.
      masses   face 4.4 thick, waist 4.8 wide, base 3.4 thick — all well clear
               of the ~1.5 unit floor where features close up at 20 px.

    VSCode may render this as a mask, so it must hold as a flat silhouette with
    no reliance on internal contrast. No defs, no gradient, no stroke.
  -->
  <path d="M2.4 8.8 L7.6 5.6 H21 V10 H14.4 L15.7 15 H19.6 V18.4 H4.4 V15 H8.3 L9.6 10 H6 Z"/>
</svg>
