<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    SandForge Marketplace mark — fire in the hearth.

    The binding constraint is the ~42 px thumbnail in Marketplace search, not
    the 128 px extension page: one dominant shape plus one supporting one.

    Same two masses as the activity-bar mark (resources/icons/toolkit.svg), but
    256 px affords what 20 px cannot: the flame and the crucible get separate
    materials — hot gold against cool steel — so they read as fire inside a
    vessel rather than as one silhouette. The activity-bar version cannot do
    this, because VSCode may render it as a mask and discard every internal
    contrast; it relies on the outline alone.

    Paint order matters here and only here: the crucible goes down first and
    the flame on top. Drawing the steel last laid a grey bar across the flame's
    flanks at exactly the value where the two gradients meet, and the mark
    collapsed into a single shape at thumbnail size. The monochrome mark has no
    such problem — it is one fill, so its order is irrelevant.

    Regenerate the PNG with `node scripts/render-icon.mjs`.
  -->
  <defs>
    <linearGradient id="sf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E2E44"/>
      <stop offset="100%" stop-color="#16161F"/>
    </linearGradient>
    <linearGradient id="sf-flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD97A"/>
      <stop offset="45%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#E2661C"/>
    </linearGradient>
    <linearGradient id="sf-steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B95B2"/>
      <stop offset="100%" stop-color="#454E66"/>
    </linearGradient>
    <radialGradient id="sf-glow" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed rounded ground: the Marketplace does not reliably round the
       listing thumbnail, so the mark carries its own radius. -->
  <rect width="256" height="256" rx="56" fill="url(#sf-bg)"/>

  <!-- Heat cast onto the ground behind the flame. Purely atmospheric: the mark
       still reads with it removed, which is the test any glow has to pass. -->
  <circle cx="128" cy="112" r="86" fill="url(#sf-glow)"/>

  <g transform="translate(14 12) scale(9.5)">
    <path d="M3.4 13.6 H6.4 V18.4 H17.6 V13.6 H20.6 V21.6 H3.4 Z"
          fill="url(#sf-steel)"/>
    <path d="M12.2 2.2 C13.7 6.6 18.3 8.4 18.3 12.9 C18.3 16.1 15.6 19.6 12 19.6
             C8.4 19.6 5.7 16.1 5.7 12.9 C5.7 9.9 7.8 8.5 9.5 6.2
             C10 8.7 10.9 9.5 11.5 9.3 C12.2 9 11.6 5.2 12.2 2.2 Z"
          fill="url(#sf-flame)"/>
  </g>
</svg>
