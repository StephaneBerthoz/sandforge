<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    SandForge Marketplace mark — anvil struck.

    The binding constraint is the ~42 px thumbnail in Marketplace search, not
    the 128 px extension page: one dominant shape plus exactly one accent.

    The spark is a solid four-point diamond sitting on the anvil's right
    shoulder. An earlier pass used a thin wedge, which read as a scratch rather
    than a strike at every size, and a small floating diamond that resolved to
    under 3 px in the thumbnail — noise, not an accent. Sitting on the shoulder
    costs no vertical room, so the anvil keeps the mass.

    The activity-bar mark (resources/icons/toolkit.svg) drops the spark on
    purpose: at 20 px two shapes crowd each other. Same anvil, one idea each.

    Regenerate the PNG with `node scripts/render-icon.mjs`.
  -->
  <defs>
    <linearGradient id="sf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E2E44"/>
      <stop offset="100%" stop-color="#16161F"/>
    </linearGradient>
    <linearGradient id="sf-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7CD72"/>
      <stop offset="55%" stop-color="#EDA83A"/>
      <stop offset="100%" stop-color="#D98A22"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed rounded ground: the Marketplace does not reliably round the
       listing thumbnail, so the mark carries its own radius. -->
  <rect width="256" height="256" rx="56" fill="url(#sf-bg)"/>

  <g transform="translate(14 12) scale(9.7)">
    <!-- Strike spark — solid, so it survives downscaling to the thumbnail. -->
    <path d="M18 2.4 L20.6 5.8 L18 9.2 L15.4 5.8 Z" fill="#F7CD72"/>
    <!-- Anvil — same geometry as the activity-bar mark. -->
    <path d="M2.4 12 L7.6 9 H20.4 V13 H14.4 L15.6 17.4 H19.2 V21 H4.6 V17.4 H8.2 L9.4 13 H6 Z"
          fill="url(#sf-metal)"/>
  </g>
</svg>
