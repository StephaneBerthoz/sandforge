<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    SandForge Marketplace mark.

    Binding constraint is the ~42 px thumbnail in Marketplace search results,
    not the 128 px extension page: one dominant shape (the anvil) plus exactly
    one accent (the strike spark). Anything else turns to noise at that size.

    Shares its geometry with resources/icons/toolkit.svg — same anvil, scaled
    8.5x and optically centred — so the two marks read as one identity.
    Regenerate the PNG with `node scripts/render-icon.mjs`.
  -->
  <defs>
    <linearGradient id="sf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E2E44"/>
      <stop offset="100%" stop-color="#16161F"/>
    </linearGradient>
    <linearGradient id="sf-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7CD72"/>
      <stop offset="55%" stop-color="#EDA83A"/>
      <stop offset="100%" stop-color="#D98A22"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed rounded ground. The Marketplace does not reliably round the
       thumbnail itself, so the mark carries its own radius. -->
  <rect width="256" height="256" rx="56" fill="url(#sf-bg)"/>

  <!-- The single accent: a strike spark off the anvil face. Sized to survive
       the 42 px thumbnail — the first pass used an 17 px diamond that landed
       at under 3 px there, i.e. invisible noise. Solid fill, not a gradient
       wash, for the same reason. -->
  <path d="M180 34 L196 62 L180 90 L164 62 Z" fill="#F7CD72"/>

  <!-- Anvil — same path as the 24px mono mark, scaled and optically centred.
       Scale 7.6 rather than 8.5: at 8.5 the base sat 12 px off the bottom edge
       and the mark read as bottom-heavy inside the rounded square. -->
  <g transform="translate(39 52) scale(7.6)">
    <path d="M2.4 8.2 L7.6 5 H21 V9.2 H14.4 L15.6 14.6 H19.6 V19.2 H4.4 V14.6 H8.4 L9.6 9.2 H6 Z"
          fill="url(#sf-metal)"/>
  </g>
</svg>
