<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
  <!--
    SandForge activity-bar mark — the forge's fire rising out of a sandbox.

    The silhouette of the Marketplace mark (resources/icon.svg): a flame
    standing in an open box seen from the front corner. In colour, depth comes
    from paint order and two steel faces; here there is one fill, so the two
    masses are kept apart by air instead.

    VSCode may render this as a mask, so it must hold as a flat silhouette
    with no reliance on internal contrast. No defs, no gradient, no stroke.

    Construction (grid units):
      flame    x 6.7 -> 17.3, y 2.0 -> 17.4 — the Marketplace flame, asymmetric,
               with its inner lick on the left so it never reads as a drop
      box      the two front faces as one band, rim y 15.6 at the corners down
               to 19.4 at the front edge, 3.4 tall
      air      2.0 between the flame's foot and the front edge, 2.6 at the
               flame's flanks — clear of the ~1.5 unit floor where features
               close up at 20 px; the faces part by 0.7 at the front edge, a
               crease that says "corner" from 24 px up and closes harmlessly
               below
  -->
  <path transform="translate(1 -0.64) scale(0.22)"
        d="M50 12 C57.5 26 74 35 74 56.5 C74 71.5 63.2 82 50 82 C36.8 82 26 71.5 26 56.5
           C26 45 32.4 38.4 37.8 31 C38.8 40 42.4 44.6 46 43.8 C49.6 43 46.6 25.6 50 12 Z"/>
  <path d="M3.6 15.6 L11.65 19.24 V22.64 L3.6 19 Z"/>
  <path d="M20.4 15.6 L12.35 19.24 V22.64 L20.4 19 Z"/>
</svg>
