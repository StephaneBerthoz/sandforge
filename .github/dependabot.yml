version: 2

updates:
  # The workflows pin every action to a commit SHA with its version in a
  # trailing comment. A pin nobody moves stops receiving security fixes, and
  # the runtime an action was built for is eventually retired: Dependabot
  # proposes the new commit and rewrites the comment with it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # No npm entry: the manifests take their shared versions from the catalog in
  # pnpm-workspace.yaml, which Dependabot's npm updater does not read. Its
  # grouped update bumped typescript-eslint, left the catalog at `^8` and wrote
  # 8.70.0 into the lockfile next to a manifest that still says `catalog:`, so
  # `pnpm install --frozen-lockfile` refused the branch on all three runners.
  # Security updates come from the repository setting rather than from this
  # file and keep arriving; one that lands on a catalogued dependency fails the
  # same way, and the fix is to move the version in pnpm-workspace.yaml by hand.
  # Two reasons that entry carried, kept here because nothing else records
  # them: `@types/vscode` moves with `engines.vscode` and never on its own,
  # since vsce refuses to package when the types are newer than the supported
  # VS Code version; and a proposal was held for seven days, the usual window
  # in which a compromised release is caught.
