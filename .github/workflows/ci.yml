name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the packageManager field in package.json
      # (pnpm-workspace.yaml settings require pnpm >= 10)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate (typecheck + test + build)
        run: pnpm build:shared && pnpm typecheck && pnpm test && pnpm build

      # Static analysis gates are deterministic; run once, not per-OS
      - name: Static gates (lint + audits)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm lint && pnpm audit:disposables && pnpm check:i18n

      # Coverage thresholds only gate here (once, not per-OS): vitest
      # configs define thresholds ~5pts under the measured baseline
      - name: Coverage thresholds
        if: matrix.os == 'ubuntu-latest'
        run: pnpm test:coverage

      # E2E tests only on Windows (matches dev environment)
      # Browsers are cached across runs; the lockfile-keyed cache
      # invalidates automatically when the Playwright version changes
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        if: matrix.os == 'windows-latest'
        with:
          path: C:\Users\runneradmin\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # --with-deps only installs system libraries on Linux; no-op on Windows
      - name: Install Playwright Chromium
        if: matrix.os == 'windows-latest'
        run: npx playwright install chromium
        working-directory: packages/webview

      - name: Run E2E tests
        if: matrix.os == 'windows-latest'
        run: pnpm --filter webview e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest' && always()
        with:
          name: playwright-report
          path: packages/webview/playwright-report/
          retention-days: 7
