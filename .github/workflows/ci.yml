name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer push to a pull request cancels the run it replaces. A master push is
# a group of its own: a group keeps only one pending run, so a shared one would
# drop a commit's result whenever a later push queued behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    # Windows runs the same `validate` in 28 minutes that ubuntu runs in 7 and
    # macOS in 5. At 30 the Windows job was cancelled mid-validate every time,
    # which is what the run history shows: a wall of "cancelled" at 30m2x for
    # months. Ubuntu also runs the E2E suite, on one worker: 33 of 45 minutes
    # in 1.39.5, and at 45 the 1.39.6 run was cancelled two thirds through it.
    timeout-minutes: 60
    strategy:
      # Each OS reports its own result. Without this, a failure on one leg
      # cancels the others — including ubuntu, the leg that runs the E2E suite,
      # which then uploads an empty Playwright report.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from the packageManager field in package.json
      # (pnpm-workspace.yaml settings require pnpm >= 10)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate (typecheck + test + build)
        run: pnpm build:shared && pnpm typecheck && pnpm test && pnpm build

      # After the build, and on every OS: it reads the paths the extension
      # resolves and asks the file system for them. 1.23.0 shipped with both
      # `<link rel="stylesheet">` tags pointing at files the build had stopped
      # producing, so every webview rendered with no CSS, and nothing here
      # noticed. Not in the static-gates step below — it needs the build.
      - name: Webview assets the extension links to
        run: pnpm check:webview-assets

      # Static analysis gates are deterministic; run once, not per-OS.
      # Keep this list in sync with the `validate` script in package.json —
      # it drifted once already: four gates (test:docs, test:gates,
      # audit:orphans, audit:test-siblings) were added to `validate` and never
      # reached CI, so they went on not running exactly as before.
      - name: Static gates (lint + docs + audits)
        if: matrix.os == 'ubuntu-latest'
        run: >
          pnpm lint &&
          pnpm test:docs &&
          pnpm test:gates &&
          pnpm audit:disposables &&
          pnpm audit:orphans &&
          pnpm audit:test-siblings &&
          pnpm check:i18n &&
          pnpm check:screenshots

      # Coverage thresholds only gate here (once, not per-OS): vitest
      # configs define thresholds ~5pts under the measured baseline
      - name: Coverage thresholds
        if: matrix.os == 'ubuntu-latest'
        run: pnpm test:coverage

      # E2E runs on ubuntu only.
      #
      # It used to run on Windows only, "matches dev environment" — and that
      # stopped being true when development moved to WSL Ubuntu. The leg also
      # never finished: the job was cancelled at 30 minutes on every run for
      # months, so the suite had never once executed in CI. The first time it
      # did, specs written against a navigation sidebar deleted in 1.8.0 were
      # still failing, unnoticed because nothing ran them — which is the whole
      # argument for keeping this leg alive.
      #
      # Browsers are cached across runs; the lockfile-keyed cache invalidates
      # when the Playwright version changes.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.os == 'ubuntu-latest'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # --with-deps installs the system libraries Chromium needs on Linux
      - name: Install Playwright Chromium
        if: matrix.os == 'ubuntu-latest'
        run: npx playwright install --with-deps chromium
        working-directory: packages/webview

      - name: Run E2E tests
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter webview e2e
        env:
          CI: true

      # A test that fails and then passes on retry leaves a green job, and the
      # html report that records it is an artifact nobody downloads when the
      # job is green. The json report is the one file a step can read, and an
      # annotation is the one place a reader will meet the number without
      # going looking for it.
      - name: Report flaky E2E tests
        if: matrix.os == 'ubuntu-latest' && always()
        run: |
          node -e '
            const fs = require("fs");
            const report = "packages/webview/test-results/results.json";
            if (!fs.existsSync(report)) {
              console.log("no Playwright json report — the E2E step did not get that far");
              process.exit(0);
            }
            const { stats } = JSON.parse(fs.readFileSync(report, "utf8"));
            if (stats.flaky > 0) {
              console.log("::warning::" + stats.flaky + " E2E test(s) passed only on retry");
            } else {
              console.log("no E2E test needed a retry");
            }
          '

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'ubuntu-latest' && always()
        with:
          name: playwright-report
          path: |
            packages/webview/playwright-report/
            packages/webview/test-results/results.json
          retention-days: 7

  # The VSIX payload, size, locale and listing gates all live in
  # pre-publish-check.sh, and until now the release workflow was the only thing
  # that ran it — so release day was the first moment anything looked at what
  # `vsce package` had actually produced. Every one of those gates can fail on a
  # tree that typechecks, tests and builds clean. The badge check is the one
  # exception here: `pnpm package` rewrites the badges before the script
  # compares them, so in this job it always passes.
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package VSIX
        run: pnpm package

      # SKIP_BUILD_CHECKS=1 drops the build and the clean install the step
      # above already did; the payload, size and listing gates still run.
      - name: Pre-publish checks
        run: SKIP_BUILD_CHECKS=1 bash scripts/pre-publish-check.sh

      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sandforge-vsix
          path: sandforge.vsix
          retention-days: 7

  # This repository is public and so is its history: a credential committed and
  # reverted an hour later is still a credential anyone can read back out of
  # it. The scan therefore reads every commit on the branch, not the tree.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The scanner is downloaded rather than run as an action: this job only
      # reads the repository, and a release archive checked against a digest
      # written here is a smaller thing to trust than an action that runs
      # inside the job.
      # --redact keeps whatever is found out of the run log, which outlives the
      # commit that carried it; the finding still names the file and the line.
      - name: Scan the history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
          echo "$GITLEAKS_SHA256  $ARCHIVE" | sha256sum --check --status
          tar -xzf "$ARCHIVE" gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
