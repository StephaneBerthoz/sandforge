name: Stryker Mutation Testing

# Mutation testing of packages/shared and of the extension's execution engine,
# one Stryker config each. A run with no incremental cache takes about a
# minute for packages/shared and two to four minutes for the extension engine,
# so it runs on every push and pull request that changes the code it mutates,
# nightly (06:00 UTC), and on manual dispatch.
#
# The paths are everything that changes what a run measures: the mutated code,
# the test setup and runner config each suite loads, the Stryker configs, and
# the lockfile that pins Stryker and vitest.

on:
  push:
    branches: [master]
    paths:
      - 'packages/shared/src/**'
      - 'packages/shared/vitest.config.ts'
      - 'packages/extension/src/core/engine/**'
      - 'packages/extension/src/test/**'
      - 'packages/extension/vitest.config.ts'
      - 'stryker.conf.json'
      - 'stryker.extension.conf.json'
      - 'pnpm-lock.yaml'
      - 'scripts/mutation-score.mjs'
      - '.github/workflows/stryker.yml'
  pull_request:
    branches: [master]
    paths:
      - 'packages/shared/src/**'
      - 'packages/shared/vitest.config.ts'
      - 'packages/extension/src/core/engine/**'
      - 'packages/extension/src/test/**'
      - 'packages/extension/vitest.config.ts'
      - 'stryker.conf.json'
      - 'stryker.extension.conf.json'
      - 'pnpm-lock.yaml'
      - 'scripts/mutation-score.mjs'
      - '.github/workflows/stryker.yml'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mutate_glob:
        description: 'Optional mutate glob override (e.g., packages/shared/src/utils/*.ts)'
        required: false
        default: ''

# A newer push to a pull request cancels the run it replaces. Every other run
# (a master push, the nightly, a dispatch) is a group of its own: a group keeps
# only one pending run, so a shared one would drop a commit's result whenever a
# later push queued behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation:
    name: Stryker (${{ matrix.name }})
    runs-on: ubuntu-latest
    # A full run, cache missed, takes one to four minutes. The limit is there
    # to stop a hung test runner, not to budget the run.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Each config runs its own package's suite and mutates only that
        # package's code: mutating extension files under the shared suite only
        # ever produced mutants no test covered.
        include:
          - name: shared
            config: stryker.conf.json
            scope: packages/shared/src
            reports: reports/mutation
            incremental: .stryker-tmp/incremental.json
          - name: extension
            config: stryker.extension.conf.json
            scope: packages/extension/src/core/engine
            reports: reports/mutation/extension
            incremental: .stryker-tmp/incremental-extension.json

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package (Stryker sandboxes consume dist/)
        run: pnpm build:shared

      # Restore the incremental report so a run only re-mutates the files, and
      # re-runs the tests, that changed since the last one.
      - name: Restore Stryker incremental cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.incremental }}
          key: stryker-incremental-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-${{ matrix.name }}-

      - name: Run Stryker
        id: stryker
        # perTest runs each mutant against the tests that cover it only.
        # ignoreStatic skips mutants in module-level code, each of which would
        # need the whole suite re-run for almost no signal.
        #
        # The dispatch glob reaches the script through env, never pasted into
        # it: `${{ }}` is substituted before bash parses the line, so a glob
        # holding quotes would run as shell code. A glob outside this leg's
        # scope leaves it nothing to mutate; the leg says so and stops.
        env:
          CI: true
          CONFIG: ${{ matrix.config }}
          SCOPE: ${{ matrix.scope }}
          MUTATE_GLOB: ${{ github.event.inputs.mutate_glob }}
        run: |
          if [ -z "$MUTATE_GLOB" ]; then
            pnpm exec stryker run "$CONFIG"
          elif [[ "$MUTATE_GLOB" == "$SCOPE"/* ]]; then
            pnpm exec stryker run "$CONFIG" --mutate "$MUTATE_GLOB"
          else
            echo "::notice::$MUTATE_GLOB is outside $SCOPE: nothing to mutate in this leg"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          fi

      # The score is Stryker's own formula over the JSON report, and the
      # threshold is read from the config the run enforced: the summary on the
      # run page has to say what the log above it says. `shell: bash` adds
      # pipefail, so a report the script cannot read fails the step instead
      # of `tee` passing it with an empty summary.
      - name: Mutation score
        if: always() && steps.stryker.outputs.skipped != 'true'
        shell: bash
        env:
          CONFIG: ${{ matrix.config }}
          REPORT: ${{ matrix.reports }}/mutation.json
          MUTATE_GLOB: ${{ github.event.inputs.mutate_glob }}
        run: |
          if [ ! -f "$REPORT" ]; then
            echo "::error::Stryker wrote no report at $REPORT"
            exit 1
          fi
          node scripts/mutation-score.mjs "$REPORT" "$CONFIG" "$MUTATE_GLOB" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always() && steps.stryker.outputs.skipped != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stryker-${{ matrix.name }}-html-report
          path: ${{ matrix.reports }}/mutation.html
          retention-days: 30

      - name: Upload JSON report
        if: always() && steps.stryker.outputs.skipped != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stryker-${{ matrix.name }}-json-report
          path: ${{ matrix.reports }}/mutation.json
          retention-days: 90
