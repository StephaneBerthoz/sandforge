name: Knip

# Blocking dead-code gate. knip.json silences only the false positives (the
# sidepanel build entry, the specs playwright itself ignores, workspace-root
# tooling deps), so every remaining line in the report is real dead weight and
# a red job is the correct answer.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer push to a pull request cancels the run it replaces. A master push is
# a group of its own: a group keeps only one pending run, so a shared one would
# drop a commit's result whenever a later push queued behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  knip:
    name: Dead-code scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Knip (markdown report)
        # The redirect writes the report before knip's exit code propagates, so
        # a failing run still leaves an artifact and a PR comment to read.
        run: pnpm knip --reporter markdown > knip-report.md

      - name: Upload Knip report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knip-report
          path: knip-report.md
          retention-days: 30

      - name: Comment Knip report on PR
        # always() — the interesting case is precisely the one where the scan
        # failed, so the comment must survive the failing step above.
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try {
              report = fs.readFileSync('knip-report.md', 'utf8');
            } catch (e) {
              report = '_Knip report not available._';
            }
            // GitHub comments are capped at 65536 chars; trim defensively.
            const MAX = 60000;
            if (report.length > MAX) {
              report = report.slice(0, MAX) +
                '\n\n_...report truncated; see artifact `knip-report` for full output._';
            }
            const body = [
              '### Knip — Dead-code scan',
              '',
              'Unused files, exports and dependencies detected by Knip.',
              'This check is blocking: anything listed below has to be deleted, wired up,',
              'or justified in `knip.json` before the PR can merge.',
              '',
              '<details><summary>Click to expand full report</summary>',
              '',
              report,
              '',
              '</details>',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            // Find any previous Knip comment authored by the bot and update it,
            // otherwise create a new one.
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.data.find(c =>
              c.user && c.user.type === 'Bot' &&
              c.body && c.body.startsWith('### Knip — Dead-code scan')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
