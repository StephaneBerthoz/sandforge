name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type (ignored when publish_only is true)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      # Marketplace versions are immutable and the publish is the one step that
      # cannot be retried by re-running this workflow: the tag it pushed before
      # publishing makes "Verify release tag is free" fail on the second run.
      # v1.18.0 hit exactly that — the gallery answered `Request timeout` after
      # the commit and tag were already on origin, leaving the release
      # unrecoverable through the pipeline that produced it. This input
      # republishes the version already committed, without touching git.
      publish_only:
        description: 'Publish the version already committed (no bump, no tag, no push)'
        required: false
        type: boolean
        default: false

# Serialize releases: two concurrent dispatches would race the version bump,
# tag creation, and Marketplace publish. Never cancel a release mid-flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # The worst case, which is the one that has to fit: everything before the
    # publish measured 6.2 minutes on a real release run (8 allowed), three
    # publish attempts of at most 5 minutes and 15 s plus a 30 s pause each
    # (17.25), and 30 gallery queries of at most 15 s plus a 20 s pause each
    # (17.5) — 43 minutes. A runner kill mid-poll would leave the tag pushed
    # and the release a draft without a word said, so the limit sits above the
    # sum.
    timeout-minutes: 45
    permissions:
      contents: write
      # Reading the CI conclusion of the commit being released is an Actions
      # API call; without this scope it answers 404 and the gate below could
      # not tell a red commit from an unknown one.
      actions: read

    # Every action below is pinned to a commit: this job can push to the
    # repository, and pnpm/action-setup provides the binary that runs the
    # Marketplace publish with VSCE_PAT in its environment. A tag can be moved
    # by whoever controls the action; a commit cannot.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Fail fast before doing any work: the Marketplace token must exist,
      # otherwise the run would bump, tag and build for 10 minutes only to die
      # at the publish step. The tag collision is checked further down, once
      # the version to release is known — see "Verify release tag is free".
      - name: Fail-fast preflight
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret is not set — cannot publish to the Marketplace"
            exit 1
          fi
          echo "Preflight OK: VSCE_PAT present"

      # pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        if: ${{ !inputs.publish_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # `pnpm validate` further down is not CI: it runs on one operating
      # system and it runs no E2E suite. A dispatch from a commit CI had
      # already rejected would bump, tag, push and publish it all the same, so
      # the conclusion of the run that did test this commit is read before the
      # first thing is written. Only ci.yml is read, not the format workflow.
      # The release commit is pushed with GITHUB_TOKEN, which starts no CI run,
      # so a later dispatch from that commit is refused with 'none': dispatch
      # from a commit CI ran on.
      - name: Require a green CI run for this commit
        if: ${{ !inputs.publish_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNS="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=completed"
          CONCLUSION=$(gh api "$RUNS" --jq '.workflow_runs[0].conclusion // "none"')
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI concluded '$CONCLUSION' for $GITHUB_SHA — release only a commit CI has passed"
            exit 1
          fi
          echo "CI check OK: $GITHUB_SHA passed CI"

      - name: Bump version
        if: ${{ !inputs.publish_only }}
        run: |
          bash scripts/bump-version.sh ${{ inputs.version }}
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      # The tag guarded here is the one this run is about to create, not the
      # one the previous run already created: checking the *current* version's
      # tag before the bump blocked every release after the first, since a
      # completed release always leaves that tag on origin. Still runs before
      # Validate/Package/push, so a collision costs a minute, not a release.
      - name: Verify release tag is free
        if: ${{ !inputs.publish_only }}
        run: |
          TAG="v${{ env.NEW_VERSION }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::$TAG already exists on origin — this version was already released"
            exit 1
          fi
          echo "Tag check OK: $TAG is free on origin"

      - name: Update lockfile
        if: ${{ !inputs.publish_only }}
        run: pnpm install --no-frozen-lockfile

      # Only what the bump wrote may enter the release commit. `git add -A`
      # swept in whatever else the tree happened to hold — a build artifact, an
      # unfinished edit — under a message that reads "release", and nothing
      # ever looked at what went in. Anything else dirty stops the run instead.
      - name: Commit version bump
        if: ${{ !inputs.publish_only }}
        run: |
          git add package.json packages/shared/package.json packages/extension/package.json \
            packages/webview/package.json README.md packages/extension/README.md pnpm-lock.yaml
          UNEXPECTED=$(git status --porcelain | grep -v '^[MA] ' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::the tree holds changes the version bump did not make — refusing to commit them"
            echo "$UNEXPECTED"
            exit 1
          fi
          git commit -m "chore: release v${{ env.NEW_VERSION }}"
          git tag "v${{ env.NEW_VERSION }}"

      - name: Validate
        run: pnpm validate

      - name: Package VSIX
        run: pnpm package

      # Fast pre-publish gates (version consistency, required manifest fields,
      # icon/README/CHANGELOG presence, VSIX size < 5 MB, bundle size).
      # Heavy steps are skipped — Validate and Package VSIX already ran above.
      - name: Pre-publish checks
        run: SKIP_BUILD_CHECKS=1 bash scripts/pre-publish-check.sh

      # Push BEFORE publishing: Marketplace versions are immutable, so a
      # publish followed by a failed push would leave a released version the
      # repo does not have. A failed publish after a successful push is
      # recoverable by re-running the publish manually.
      - name: Push commit and tag
        if: ${{ !inputs.publish_only }}
        run: |
          git push origin HEAD
          git push origin "v${{ env.NEW_VERSION }}"

      # In publish_only mode nothing set NEW_VERSION, so read it from the
      # checkout — that is the version the VSIX was just built from.
      - name: Resolve version to publish
        if: ${{ inputs.publish_only }}
        run: echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      # Drafted before the publish, undrafted once the Marketplace serves the
      # version. A publish that fails now leaves the tag on origin with the
      # notes and the VSIX already attached, which is what the person finishing
      # the release by hand needs — and nothing public appears in the meantime.
      #
      # `gh` is already on the runner, so the release needs no third-party
      # action in a job that can push to the repository. --verify-tag refuses
      # to create a missing tag: the release belongs on the tag that was pushed
      # with the version, not on whatever master points to by then. A re-run
      # with publish_only finds the draft its predecessor left and keeps it.
      - name: Draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$NEW_VERSION" > /dev/null 2>&1; then
            echo "Release v$NEW_VERSION already exists — leaving it as it is"
            exit 0
          fi
          gh release create "v$NEW_VERSION" sandforge.vsix \
            --draft \
            --verify-tag \
            --title "SandForge v$NEW_VERSION" \
            --generate-notes

      # Use the lockfile-pinned vsce (devDependency of packages/extension)
      # instead of `npx @vscode/vsce`, which would fetch the latest release.
      #
      # Three runs in a row failed here, a bump and two publish_only retries of
      # the same version: the gallery call returned an error after about three
      # minutes each time. The attempt is now made three times within one run.
      # `timeout` bounds each one: none has hung yet, but this endpoint is known
      # to stall from CI runners, and an unbounded hang would take the whole
      # job with it. Its signal reaches pnpm, not necessarily the upload pnpm
      # started, so --kill-after forces the attempt down 15 s later rather than
      # letting it run on beside the next one. A failed third attempt does not
      # fail the step: a publish that errored or stalled after uploading is
      # indistinguishable from one that never uploaded, and only the gallery can
      # say which happened — the next step asks it, and it is that answer which
      # decides the run.
      - name: Publish to Marketplace
        working-directory: packages/extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          for attempt in 1 2 3; do
            if timeout --kill-after=15 300 pnpm exec vsce publish --packagePath ../../sandforge.vsix; then
              echo "Published on attempt $attempt"
              exit 0
            fi
            echo "::warning::publish attempt $attempt failed or timed out"
            sleep 30
          done
          echo "::warning::three publish attempts failed — asking the Marketplace whether one of them landed"

      # The gallery is the only authority on whether the version exists: it is
      # immutable once served, and a republish of a version it already has is
      # refused. Filter type 7 is an exact extension name; flag 16 is
      # IncludeVersionProperties, and the response carries the version list
      # with it. Each query is bounded like the publish is, so a stalled request
      # counts as one more attempt instead of stopping the loop. A version that
      # never appears fails the run with the release still a draft.
      - name: Wait for the Marketplace to serve the version
        run: |
          EXTENSION=$(node -p "const p=require('./packages/extension/package.json'); p.publisher + '.' + p.name")
          QUERY='{"filters":[{"criteria":[{"filterType":7,"value":"'"$EXTENSION"'"}]}],"flags":16}'
          for attempt in $(seq 1 30); do
            if curl --connect-timeout 10 --max-time 15 -sS -X POST https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery \
              -H 'Accept: application/json;api-version=7.2-preview.1' \
              -H 'Content-Type: application/json' \
              -d "$QUERY" | node -e '
                let raw = "";
                process.stdin.on("data", (chunk) => { raw += chunk; });
                process.stdin.on("end", () => {
                  const versions = JSON.parse(raw).results?.[0]?.extensions?.[0]?.versions ?? [];
                  process.exit(versions.some((v) => v.version === process.env.NEW_VERSION) ? 0 : 1);
                });
              '; then
              echo "Marketplace is serving $EXTENSION v$NEW_VERSION"
              exit 0
            fi
            echo "Attempt $attempt: the Marketplace does not serve v$NEW_VERSION yet"
            sleep 20
          done
          echo "::error::the Marketplace never served v$NEW_VERSION — the GitHub Release stays a draft"
          exit 1

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$NEW_VERSION" --draft=false
