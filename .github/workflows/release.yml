name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: |
          bash scripts/bump-version.sh ${{ inputs.version }}
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Update lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit version bump
        run: |
          git add -A
          git commit -m "chore: release v${{ env.NEW_VERSION }}"
          git tag "v${{ env.NEW_VERSION }}"

      - name: Validate
        run: pnpm validate

      - name: Package VSIX
        run: pnpm package

      # Fast pre-publish gates (version consistency, required manifest fields,
      # icon/README/CHANGELOG presence, VSIX size < 5 MB, bundle size).
      # Heavy steps are skipped — Validate and Package VSIX already ran above.
      - name: Pre-publish checks
        run: SKIP_BUILD_CHECKS=1 bash scripts/pre-publish-check.sh

      - name: Publish to Marketplace
        run: npx @vscode/vsce publish --packagePath sandforge.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Push commit and tag
        run: |
          git push origin master
          git push origin "v${{ env.NEW_VERSION }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: SandForge v${{ env.NEW_VERSION }}
          files: sandforge.vsix
          generate_release_notes: true
