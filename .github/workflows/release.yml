name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type (ignored when publish_only is true)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      # Marketplace versions are immutable and the publish is the one step that
      # cannot be retried by re-running this workflow: the tag it pushed before
      # publishing makes "Verify release tag is free" fail on the second run.
      # v1.18.0 hit exactly that — the gallery answered `Request timeout` after
      # the commit and tag were already on origin, leaving the release
      # unrecoverable through the pipeline that produced it. This input
      # republishes the version already committed, without touching git.
      publish_only:
        description: 'Publish the version already committed (no bump, no tag, no push)'
        required: false
        type: boolean
        default: false

# Serialize releases: two concurrent dispatches would race the version bump,
# tag creation, and Marketplace publish. Never cancel a release mid-flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    # Every action below is pinned to a commit: this job can push to the
    # repository, and pnpm/action-setup provides the binary that runs the
    # Marketplace publish with VSCE_PAT in its environment. A tag can be moved
    # by whoever controls the action; a commit cannot.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Fail fast before doing any work: the Marketplace token must exist,
      # otherwise the run would bump, tag and build for 10 minutes only to die
      # at the publish step. The tag collision is checked further down, once
      # the version to release is known — see "Verify release tag is free".
      - name: Fail-fast preflight
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret is not set — cannot publish to the Marketplace"
            exit 1
          fi
          echo "Preflight OK: VSCE_PAT present"

      # pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        if: ${{ !inputs.publish_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        if: ${{ !inputs.publish_only }}
        run: |
          bash scripts/bump-version.sh ${{ inputs.version }}
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      # The tag guarded here is the one this run is about to create, not the
      # one the previous run already created: checking the *current* version's
      # tag before the bump blocked every release after the first, since a
      # completed release always leaves that tag on origin. Still runs before
      # Validate/Package/push, so a collision costs a minute, not a release.
      - name: Verify release tag is free
        if: ${{ !inputs.publish_only }}
        run: |
          TAG="v${{ env.NEW_VERSION }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::$TAG already exists on origin — this version was already released"
            exit 1
          fi
          echo "Tag check OK: $TAG is free on origin"

      - name: Update lockfile
        if: ${{ !inputs.publish_only }}
        run: pnpm install --no-frozen-lockfile

      - name: Commit version bump
        if: ${{ !inputs.publish_only }}
        run: |
          git add -A
          git commit -m "chore: release v${{ env.NEW_VERSION }}"
          git tag "v${{ env.NEW_VERSION }}"

      - name: Validate
        run: pnpm validate

      - name: Package VSIX
        run: pnpm package

      # Fast pre-publish gates (version consistency, required manifest fields,
      # icon/README/CHANGELOG presence, VSIX size < 5 MB, bundle size).
      # Heavy steps are skipped — Validate and Package VSIX already ran above.
      - name: Pre-publish checks
        run: SKIP_BUILD_CHECKS=1 bash scripts/pre-publish-check.sh

      # Push BEFORE publishing: Marketplace versions are immutable, so a
      # publish followed by a failed push would leave a released version the
      # repo does not have. A failed publish after a successful push is
      # recoverable by re-running the publish manually.
      - name: Push commit and tag
        if: ${{ !inputs.publish_only }}
        run: |
          git push origin HEAD
          git push origin "v${{ env.NEW_VERSION }}"

      # Use the lockfile-pinned vsce (devDependency of packages/extension)
      # instead of `npx @vscode/vsce`, which would fetch the latest release.
      - name: Publish to Marketplace
        run: cd packages/extension && pnpm exec vsce publish --packagePath ../../sandforge.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # In publish_only mode nothing set NEW_VERSION, so read it from the
      # checkout — that is the version the VSIX was just built from.
      - name: Resolve version to publish
        if: ${{ inputs.publish_only }}
        run: echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      # `gh` is already on the runner, so the release needs no third-party
      # action in a job that can push to the repository. --verify-tag refuses
      # to create a missing tag: the release belongs on the tag that was pushed
      # with the version, not on whatever master points to by then.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v$NEW_VERSION" sandforge.vsix
          --verify-tag
          --title "SandForge v$NEW_VERSION"
          --generate-notes
