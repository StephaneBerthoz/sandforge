name: Format Check

# Blocking Prettier check. The global format pass has merged (drift is
# now zero), so `pnpm format:check` enforces the baseline on push and
# PR-diff formatting on pull requests.
#
# Coverage is the whole repository, not just `packages/*/src`: the scripts,
# the workflows, the docs and the root config drift too, and that is where
# the gates themselves live. The changed-file filter below must therefore
# stay in step with the `format`/`format:check` globs in the root
# package.json — same extensions, same exclusions.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer push to a pull request cancels the run it replaces. A master push is
# a group of its own: a group keeps only one pending run, so a shared one would
# drop a commit's result whenever a later push queued behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format-check:
    name: Prettier check (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The failing check is the whole report: the log lists the files that
      # drifted, and `pnpm format` fixes them.
      - name: Run Prettier drift scan (changed files only on PR)
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" \
              | grep -E '\.(ts|tsx|mjs|cjs|js|json|css|md|yml|yaml|html)$' \
              | grep -vE '(^|/)(node_modules|dist|build|__snapshots__)/' \
              | grep -vx 'pnpm-lock.yaml' || true)
            if [ -z "$CHANGED" ]; then
              echo "No matching changed files — skipping."
              exit 0
            fi
            echo "Checking changed files:"
            echo "$CHANGED"
            echo "$CHANGED" | xargs pnpm exec prettier --check
            CODE=$?
          else
            pnpm format:check
            CODE=$?
          fi
          set -e
          # Blocking: drift fails the check.
          exit $CODE
