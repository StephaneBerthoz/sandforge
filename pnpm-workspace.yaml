packages:
  - 'packages/*'

# Shared devDependency versions — referenced as "catalog:" from the package
# manifests. Bump here, once. Only deps with a strictly identical range in
# every consuming package belong here. @vitest/coverage-v8 is one of them: it
# has to match vitest exactly, since each release peers on its own version.
catalog:
  '@eslint/js': '^9'
  eslint: '^9'
  eslint-config-prettier: '^10'
  eslint-plugin-react-hooks: '^7'
  fast-check: '^3'
  typescript: '~6.0'
  typescript-eslint: '^8.70.1'
  vitest: '^5.0.1'
  '@vitest/coverage-v8': '^5.0.1'

# pnpm 11 build-script approvals, the only list pnpm 11 reads: it dropped
# onlyBuiltDependencies and its siblings and ignores them without a warning
# (packages/extension/src/test/workspacePolicy.test.ts keeps them out).
# esbuild: required for the extension bundle. @vscode/vsce-sign: required by
# `vsce package`. core-js*: postinstall is a funding banner only — stays
# blocked. keytar: optional dependency of @vscode/vsce, reached only by the
# interactive `vsce login` keychain flow; releases authenticate with VSCE_PAT
# and the extension itself stores secrets through VSCode SecretStorage
# (adapters/storage/StorageAdapter.ts), so its node-gyp build never runs on a
# path we use — stays blocked.
allowBuilds:
  '@vscode/vsce-sign': true
  core-js: false
  core-js-pure: false
  esbuild: true
  keytar: false

# Security overrides — all entries close high-severity CVEs surfaced by `pnpm audit`.
# picomatch / lodash: see Round 1 commit 1b27ff9.
# minimatch (3 ranges, one per major): ReDoS, replacement constrained to <4 on
# the 3.x line so CJS-default consumers like @vscode/vsce keep working
# (vsce uses `__importDefault(require('minimatch'))` which only works on 3.x).
# vsce is held to 3.x as well. 3.1.4 is the floor: three ReDoS advisories cover
# the 3.x line, GHSA-7r86-cg39-jmmj and GHSA-3ppc-4f35-3m26 below 3.1.3 and
# GHSA-23c5-xmqv-rm74 below 3.1.4, so the 3.1.2 vsce was pinned to was inside
# all three.
# rollup >=4.59.0: sourcemap-injection in older 4.x. flatted >=3.4.2: prototype
# pollution. picomatch, minimatch, rollup and flatted are devDep-only — they
# don't ship in the marketplace VSIX. lodash is the exception: recharts depends
# on it, so this range rewrites code that ships inside webview-dist. It stays
# global rather than narrowed to `recharts>lodash` because 4.18.1 is already
# the single resolution — narrowing would re-resolve a chart dependency for no
# security gain. Any lodash bump is smoke-tested in CI: an E2E test renders a
# Monitor chart with Recharts and checks it drew a curve
# (packages/webview/e2e/monitor.spec.ts).
overrides:
  'picomatch@<4.0.4': '>=4.0.4'
  'lodash@<4.18.0': '>=4.18.0'
  'minimatch@<3.1.4': '>=3.1.4 <4'
  'minimatch@>=9.0.0 <9.0.7': '>=9.0.7'
  'minimatch@>=10.0.0 <10.2.3': '>=10.2.3'
  '@vscode/vsce>minimatch': '>=3.1.4 <4'
  'rollup@>=4.0.0 <4.59.0': '>=4.59.0'
  'flatted@<3.4.2': '>=3.4.2'
  # Critical, and it SHIPS: jsforce -> faye -> faye-websocket pulls this in,
  # and esbuild bundles the whole stack into dist/jsforceEntry.js (29 hits on
  # `Sec-WebSocket`, 3 on `/meta/handshake`). Every other advisory in the tree
  # is dev-only; this one reaches users.
  'websocket-driver@<0.7.5': '>=0.7.5'
  # Also shipped, via jsforce's HTTP layer. Patch bump, no API change.
  'form-data@>=4.0.0 <4.0.6': '>=4.0.6'
  'csv-parse@<7.0.2': '>=7.0.2'
  # Dev only. qs arrives through typed-rest-client, which Stryker's reporter and
  # vsce's publishing client both use, and typed-rest-client 2.x pins it to
  # 6.15.1 exactly, so no parent range can lift it. 6.16.0 closes
  # GHSA-4mjr-xmp4-gh2g, GHSA-x5fp-wj9c-mxmx and GHSA-q8mj-m7cp-5q26 and keeps
  # the 6.x API.
  'qs@>=2.2.5 <6.16.0': '>=6.16.0 <7'
  # Dev only, through jsdom in the webview tests. 8.21.0 closes
  # GHSA-96hv-2xvq-fx4p; the 8.x API is unchanged.
  'ws@>=8.0.0 <8.21.0': '>=8.21.0 <9'
  # Dev only, and new to the tree with the smoke suite: @vscode/test-cli pins
  # mocha ^11.7.6, and mocha 11 asks for diff ^7 and serialize-javascript ^6.
  # mocha 12 already moved to the patched majors (diff ^9, serialize-javascript
  # ^7.1.1), so the jump is one mocha made itself — it is taken here because
  # test-cli's range cannot reach mocha 12. Each floor is the highest patched
  # version across every advisory on the package: 8.0.3 for GHSA-73rr-hh4g-fpgx
  # (diff), and 7.0.5 for GHSA-qj8w-gfj5-8c6v and GHSA-5c6j-r48x-rmvq together
  # (serialize-javascript).
  'diff@>=6.0.0 <8.0.3': '>=8.0.3 <9'
  'serialize-javascript@<7.0.5': '>=7.0.5 <8'
