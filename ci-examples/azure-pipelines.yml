# SandForge — Azure DevOps Pipeline (EXAMPLE)
#
# Honest example built on what actually exists in this repo:
#   1. Quality gates   — pnpm validate (build:shared, typecheck, lint, tests, i18n, build)
#   2. Clone (dry-run) — packages/extension/cli/sandforge-clone.ts via tsx, its
#                        JSON summary saved to clone-summary.json
#   3. Removal (opt-in) — the same script with --remove clone-summary.json takes
#                        back what that clone created, and nothing else
#   4. VSIX package    — pnpm package, published as a pipeline artifact
#
# There is no installed `sandforge` command: each headless tool is a script of
# packages/extension/cli/, run with tsx from a checkout. See ci-examples/README.md.
#
# Prerequisites:
#   - Create a Variable Group named "SandForge-Credentials" with:
#     - SFDX_AUTH_URL_SOURCE: sfdx auth URL of the source org (secret)
#     - SFDX_AUTH_URL_TARGET: sfdx auth URL of the target sandbox (secret)
#     - SANDFORGE_SF_ORGS: set to 'true' to enable the Clone stage
#     - SF_CLONE_RECORD_ID: Salesforce record Id to clone (e.g. 500...)
#
# This example sends no failure message of its own: Azure DevOps notifies on
# a failed run through Project settings > Notifications.
#
# `main` below stands for your default branch; rename it if yours differs.

trigger:
  branches:
    include:
      - main

# Schedule: every Monday at 6 AM UTC
schedules:
  - cron: '0 6 * * 1'
    displayName: Weekly SandForge Pipeline
    branches:
      include:
        - main
    always: true

parameters:
  - name: dryRun
    displayName: 'Dry Run Mode (the clone writes nothing)'
    type: boolean
    default: true
  - name: removeAfter
    displayName: 'Once a real clone is done, remove the records it created at the end of the job'
    type: boolean
    default: false

variables:
  - group: SandForge-Credentials
  - name: nodeVersion
    value: '24'
  - name: dryRunFlag
    ${{ if eq(parameters.dryRun, true) }}:
      value: '--dry-run'
    ${{ else }}:
      value: ''

pool:
  vmImage: 'ubuntu-latest'

stages:
  # ── Quality gates ────────────────────────────────────────────
  - stage: Quality
    displayName: 'Quality Gates'
    jobs:
      - job: Test
        displayName: 'Validate (typecheck, lint, tests, build)'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'

          # pnpm comes from the `packageManager` pin in package.json.
          - script: corepack enable
            displayName: 'Enable pnpm'

          - script: pnpm install --frozen-lockfile
            displayName: 'Install dependencies'

          # Chains build:shared → typecheck → lint → test → check:i18n →
          # build. build:shared has to run first: the other packages import
          # @sandforge/shared from its dist/, so a bare `pnpm typecheck` on a
          # fresh checkout dies there. Split into separate script steps only
          # with build:shared in front.
          - script: pnpm validate
            displayName: 'Validate'

  # ── Forge clone + removal (real CLI, dry-run default) ────────
  - stage: Clone
    displayName: 'Forge Clone (sandforge-clone)'
    dependsOn: Quality
    # Only runs after the quality gates pass, and when sf org secrets and a
    # record to clone have been configured. A custom condition drops the
    # implicit succeeded(), so it is spelled out.
    condition: and(succeeded(), eq(variables['SANDFORGE_SF_ORGS'], 'true'), ne(variables['SF_CLONE_RECORD_ID'], ''))
    jobs:
      - job: CloneRecords
        displayName: 'Clone record graph'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'

          - script: |
              corepack enable
              npm install -g @salesforce/cli
            displayName: 'Enable pnpm and install Salesforce CLI'

          - script: |
              pnpm install --frozen-lockfile
              pnpm build:shared
            displayName: 'Install dependencies and build shared'

          # The URLs go to a private directory that is removed when this shell
          # exits, a failed login included: self-hosted agents keep /tmp.
          - script: |
              umask 077
              auth_dir=$(mktemp -d)
              trap 'rm -rf "$auth_dir"' EXIT
              printf '%s' "$SFDX_AUTH_URL_SOURCE" > "$auth_dir/source.txt"
              printf '%s' "$SFDX_AUTH_URL_TARGET" > "$auth_dir/target.txt"
              sf org login sfdxurl --sfdx-url-file "$auth_dir/source.txt" --alias ci-source
              sf org login sfdxurl --sfdx-url-file "$auth_dir/target.txt" --alias ci-target
            env:
              # Secret variables reach a script only through an explicit mapping.
              SFDX_AUTH_URL_SOURCE: $(SFDX_AUTH_URL_SOURCE)
              SFDX_AUTH_URL_TARGET: $(SFDX_AUTH_URL_TARGET)
            displayName: 'Authenticate source and target orgs'

          - script: |
              pnpm exec tsx packages/extension/cli/sandforge-clone.ts \
                --record "$(SF_CLONE_RECORD_ID)" \
                --source ci-source \
                --target ci-target \
                --upsert \
                $(dryRunFlag) \
                --json \
                --remap-csv remap.csv \
                > clone-summary.json
            displayName: 'Clone record graph (sandforge-clone)'

          # Your checks against the cloned records go here.

          # Takes back what the clone created, from the summary it saved: never
          # a record the target already held, and not one changed since the
          # clone (add --include-changed when your checks change them). A dry
          # run created nothing and its summary is refused, so this step is
          # only there after a real clone. What the removal wrote to the
          # records it kept goes to clone-summary.removals.json, which a later
          # --remove of the same summary reads: both go with the report.
          - ${{ if and(eq(parameters.dryRun, false), eq(parameters.removeAfter, true)) }}:
              - script: |
                  pnpm exec tsx packages/extension/cli/sandforge-clone.ts \
                    --remove clone-summary.json \
                    --target ci-target \
                    --json \
                    > clone-removal.json
                displayName: 'Remove what the clone created (sandforge-clone --remove)'

          # Copied into one folder first: CopyFiles skips a file the run did not
          # write — the removal's, after a dry run — where a publish task per
          # file would fail on it.
          - task: CopyFiles@2
            condition: always()
            inputs:
              Contents: |
                clone-summary.json
                clone-summary.removals.json
                clone-removal.json
                remap.csv
              TargetFolder: $(Build.ArtifactStagingDirectory)/clone-report
            displayName: 'Collect the clone report'

          - task: PublishPipelineArtifact@1
            condition: always()
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/clone-report
              artifactName: clone-report
            displayName: 'Publish the clone report'

  # ── VSIX package ────────────────────────────────────────────
  - stage: Package
    displayName: 'Package VSIX'
    dependsOn: Quality
    jobs:
      - job: Vsix
        displayName: 'Build and package VSIX'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'

          # pnpm comes from the `packageManager` pin in package.json.
          - script: corepack enable
            displayName: 'Enable pnpm'

          - script: pnpm install --frozen-lockfile
            displayName: 'Install dependencies'

          - script: pnpm package
            displayName: 'Build and package VSIX'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: sandforge.vsix
              artifactName: sandforge-vsix
            displayName: 'Publish VSIX artifact'
