# SandForge — Azure DevOps Pipeline (EXAMPLE)
#
# Honest example built on what actually exists in this repo:
#   1. Quality gates   — pnpm validate (build:shared, typecheck, lint, tests, i18n, build)
#   2. Clone (dry-run) — packages/extension/cli/sandforge-clone.ts via tsx
#   3. Cleanup (always dry-run) — packages/extension/cli/sandforge-cleanup.ts via tsx
#   4. VSIX package    — pnpm package, published as a pipeline artifact
#
# There is NO `sandforge seed|sync|backup|health` CLI — those stages exist
# only in the VSCode extension UI. See ci-examples/README.md for details.
#
# Prerequisites:
#   - Create a Variable Group named "SandForge-Credentials" with:
#     - SFDX_AUTH_URL_SOURCE: sfdx auth URL of the source org (secret)
#     - SFDX_AUTH_URL_TARGET: sfdx auth URL of the target sandbox (secret)
#     - SANDFORGE_SF_ORGS: set to 'true' to enable the Clone stage
#     - SF_CLONE_RECORD_ID: Salesforce record Id to clone (e.g. 500...)
#
# This example sends no failure message of its own: Azure DevOps notifies on
# a failed run through Project settings > Notifications.
#
# `main` below stands for your default branch; rename it if yours differs.

trigger:
  branches:
    include:
      - main

# Schedule: every Monday at 6 AM UTC
schedules:
  - cron: '0 6 * * 1'
    displayName: Weekly SandForge Pipeline
    branches:
      include:
        - main
    always: true

parameters:
  - name: dryRun
    displayName: 'Dry Run Mode (the clone writes nothing; cleanup is always a preview)'
    type: boolean
    default: true

variables:
  - group: SandForge-Credentials
  - name: nodeVersion
    value: '22'
  - name: dryRunFlag
    ${{ if eq(parameters.dryRun, true) }}:
      value: '--dry-run'
    ${{ else }}:
      value: ''

pool:
  vmImage: 'ubuntu-latest'

stages:
  # ── Quality gates ────────────────────────────────────────────
  - stage: Quality
    displayName: 'Quality Gates'
    jobs:
      - job: Test
        displayName: 'Validate (typecheck, lint, tests, build)'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'

          # pnpm comes from the `packageManager` pin in package.json.
          - script: corepack enable
            displayName: 'Enable pnpm'

          - script: pnpm install --frozen-lockfile
            displayName: 'Install dependencies'

          # Chains build:shared → typecheck → lint → test → check:i18n →
          # build. build:shared has to run first: the other packages import
          # @sandforge/shared from its dist/, so a bare `pnpm typecheck` on a
          # fresh checkout dies there. Split into separate script steps only
          # with build:shared in front.
          - script: pnpm validate
            displayName: 'Validate'

  # ── Forge clone + cleanup (real CLIs, dry-run default) ──────
  - stage: Clone
    displayName: 'Forge Clone (sandforge-clone)'
    dependsOn: Quality
    # Only runs after the quality gates pass, and when sf org secrets and a
    # record to clone have been configured. A custom condition drops the
    # implicit succeeded(), so it is spelled out.
    condition: and(succeeded(), eq(variables['SANDFORGE_SF_ORGS'], 'true'), ne(variables['SF_CLONE_RECORD_ID'], ''))
    jobs:
      - job: CloneRecords
        displayName: 'Clone record graph + cleanup preview'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'

          - script: |
              corepack enable
              npm install -g @salesforce/cli
            displayName: 'Enable pnpm and install Salesforce CLI'

          - script: |
              pnpm install --frozen-lockfile
              pnpm build:shared
            displayName: 'Install dependencies and build shared'

          # The URLs go to a private directory that is removed when this shell
          # exits, a failed login included: self-hosted agents keep /tmp.
          - script: |
              umask 077
              auth_dir=$(mktemp -d)
              trap 'rm -rf "$auth_dir"' EXIT
              printf '%s' "$SFDX_AUTH_URL_SOURCE" > "$auth_dir/source.txt"
              printf '%s' "$SFDX_AUTH_URL_TARGET" > "$auth_dir/target.txt"
              sf org login sfdxurl --sfdx-url-file "$auth_dir/source.txt" --alias ci-source
              sf org login sfdxurl --sfdx-url-file "$auth_dir/target.txt" --alias ci-target
            env:
              # Secret variables reach a script only through an explicit mapping.
              SFDX_AUTH_URL_SOURCE: $(SFDX_AUTH_URL_SOURCE)
              SFDX_AUTH_URL_TARGET: $(SFDX_AUTH_URL_TARGET)
            displayName: 'Authenticate source and target orgs'

          - script: |
              pnpm exec tsx packages/extension/cli/sandforge-clone.ts \
                --record "$(SF_CLONE_RECORD_ID)" \
                --source ci-source \
                --target ci-target \
                --upsert \
                $(dryRunFlag) \
                --json \
                --remap-csv remap.csv \
                > clone-summary.json
            displayName: 'Clone record graph (sandforge-clone)'

          # Always a preview, whatever dryRun says: `--since today` matches
          # every record the CI user created today, not only the ones this
          # clone wrote. Run the real delete by hand once you have read the counts.
          - script: |
              pnpm exec tsx packages/extension/cli/sandforge-cleanup.ts \
                --target ci-target \
                --since today \
                --dry-run
            displayName: 'Preview cleanup (sandforge-cleanup, dry-run)'

          - task: PublishPipelineArtifact@1
            condition: always()
            inputs:
              targetPath: clone-summary.json
              artifactName: clone-report
            displayName: 'Publish clone summary'

          - task: PublishPipelineArtifact@1
            condition: always()
            inputs:
              targetPath: remap.csv
              artifactName: clone-remap-csv
            displayName: 'Publish ID remap CSV'

  # ── VSIX package ────────────────────────────────────────────
  - stage: Package
    displayName: 'Package VSIX'
    dependsOn: Quality
    jobs:
      - job: Vsix
        displayName: 'Build and package VSIX'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'

          # pnpm comes from the `packageManager` pin in package.json.
          - script: corepack enable
            displayName: 'Enable pnpm'

          - script: pnpm install --frozen-lockfile
            displayName: 'Install dependencies'

          - script: pnpm package
            displayName: 'Build and package VSIX'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: sandforge.vsix
              artifactName: sandforge-vsix
            displayName: 'Publish VSIX artifact'
