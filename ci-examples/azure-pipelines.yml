# SandForge — Azure DevOps Pipeline (EXAMPLE)
#
# Honest example built on what actually exists in this repo:
#   1. Quality gates   — pnpm validate (build:shared, typecheck, lint, tests, i18n, build)
#   2. Clone (dry-run) — packages/extension/cli/sandforge-clone.ts via tsx
#   3. Cleanup (dry-run) — packages/extension/cli/sandforge-cleanup.ts via tsx
#   4. VSIX package    — pnpm package, published as a pipeline artifact
#
# There is NO `sandforge seed|sync|backup|health` CLI — those stages exist
# only in the VSCode extension UI. See ci-examples/README.md for details.
#
# Prerequisites:
#   - Create a Variable Group named "SandForge-Credentials" with:
#     - SFDX_AUTH_URL_SOURCE: sfdx auth URL of the source org (secret)
#     - SFDX_AUTH_URL_TARGET: sfdx auth URL of the target sandbox (secret)
#     - SANDFORGE_SF_ORGS: set to 'true' to enable the Clone stage
#     - SF_CLONE_RECORD_ID: Salesforce record Id to clone (e.g. 500...)
#     - SLACK_WEBHOOK_URL: (optional) Slack webhook for failure notifications (secret)

trigger:
  branches:
    include:
      - main

# Schedule: every Monday at 6 AM UTC
schedules:
  - cron: '0 6 * * 1'
    displayName: Weekly SandForge Pipeline
    branches:
      include:
        - main
    always: true

parameters:
  - name: dryRun
    displayName: 'Dry Run Mode (clone/cleanup write nothing)'
    type: boolean
    default: true

variables:
  - group: SandForge-Credentials
  - name: nodeVersion
    value: '22'
  - name: dryRunFlag
    ${{ if eq(parameters.dryRun, true) }}:
      value: '--dry-run'
    ${{ else }}:
      value: ''

pool:
  vmImage: 'ubuntu-latest'

stages:
  # ── Quality gates ────────────────────────────────────────────
  - stage: Quality
    displayName: 'Quality Gates'
    jobs:
      - job: Test
        displayName: 'Validate (typecheck, lint, tests, build)'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'

          - script: npm install -g pnpm@11
            displayName: 'Install pnpm'

          - script: pnpm install --frozen-lockfile
            displayName: 'Install dependencies'

          # Chains build:shared → typecheck → lint → test → check:i18n →
          # build. build:shared has to run first: the other packages import
          # @sandforge/shared from its dist/, so a bare `pnpm typecheck` on a
          # fresh checkout dies there. Split into separate script steps only
          # with build:shared in front.
          - script: pnpm validate
            displayName: 'Validate'

  # ── Forge clone + cleanup (real CLIs, dry-run default) ──────
  - stage: Clone
    displayName: 'Forge Clone (sandforge-clone)'
    dependsOn: Quality
    # Only runs when sf org secrets have been configured
    condition: eq(variables['SANDFORGE_SF_ORGS'], 'true')
    jobs:
      - job: CloneRecords
        displayName: 'Clone record graph + cleanup dry-run'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'

          - script: npm install -g pnpm@11 @salesforce/cli
            displayName: 'Install pnpm and Salesforce CLI'

          - script: |
              pnpm install --frozen-lockfile
              pnpm build:shared
            displayName: 'Install dependencies and build shared'

          - script: |
              echo "$(SFDX_AUTH_URL_SOURCE)" > /tmp/auth-source.txt
              echo "$(SFDX_AUTH_URL_TARGET)" > /tmp/auth-target.txt
              sf org login sfdxurl --sfdx-url-file /tmp/auth-source.txt --alias ci-source
              sf org login sfdxurl --sfdx-url-file /tmp/auth-target.txt --alias ci-target
              rm -f /tmp/auth-source.txt /tmp/auth-target.txt
            displayName: 'Authenticate source and target orgs'

          - script: |
              pnpm exec tsx packages/extension/cli/sandforge-clone.ts \
                --record "$(SF_CLONE_RECORD_ID)" \
                --source ci-source \
                --target ci-target \
                --upsert \
                $(dryRunFlag) \
                --json \
                --remap-csv remap.csv \
                > clone-summary.json
            displayName: 'Clone record graph (sandforge-clone)'

          - script: |
              pnpm exec tsx packages/extension/cli/sandforge-cleanup.ts \
                --target ci-target \
                --since today \
                $(dryRunFlag)
            displayName: 'Cleanup cloned records (sandforge-cleanup)'

          - task: PublishPipelineArtifact@1
            condition: always()
            inputs:
              targetPath: clone-summary.json
              artifactName: clone-report
            displayName: 'Publish clone summary'

          - task: PublishPipelineArtifact@1
            condition: always()
            inputs:
              targetPath: remap.csv
              artifactName: clone-remap-csv
            displayName: 'Publish ID remap CSV'

  # ── VSIX package ────────────────────────────────────────────
  - stage: Package
    displayName: 'Package VSIX'
    dependsOn: Quality
    jobs:
      - job: Vsix
        displayName: 'Build and package VSIX'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'

          - script: npm install -g pnpm@11
            displayName: 'Install pnpm'

          - script: pnpm install --frozen-lockfile
            displayName: 'Install dependencies'

          - script: pnpm package
            displayName: 'Build and package VSIX'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: sandforge.vsix
              artifactName: sandforge-vsix
            displayName: 'Publish VSIX artifact'
