# SandForge — GitLab CI/CD Pipeline
# This pipeline runs the full SandForge workflow:
#   1. Seed sandbox with test data
#   2. Sync data between orgs
#   3. Backup target org data
#   4. Run health check on target org
#   5. Generate execution report
#
# Prerequisites:
#   - Set the following CI/CD variables in your GitLab project settings:
#     - SF_SOURCE_USERNAME: Salesforce source org username
#     - SF_SOURCE_PASSWORD: Salesforce source org password + security token (masked)
#     - SF_SOURCE_LOGIN_URL: Salesforce source login URL
#     - SF_TARGET_USERNAME: Salesforce target org username
#     - SF_TARGET_PASSWORD: Salesforce target org password + security token (masked)
#     - SF_TARGET_LOGIN_URL: Salesforce target login URL
#     - SLACK_WEBHOOK_URL: (optional) Slack webhook for failure notifications

image: node:20-alpine

# Cache pnpm store across pipeline runs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .pnpm-store

# Default environment variables for all stages
variables:
  PNPM_VERSION: "9"
  DRY_RUN: "false"

# Pipeline stages — executed in order
stages:
  - setup
  - seed
  - sync
  - backup
  - health-check
  - report

# ── Setup ────────────────────────────────────────────────────
setup:
  stage: setup
  script:
    # Install pnpm globally
    - npm install -g pnpm@$PNPM_VERSION
    # Configure pnpm store location for caching
    - pnpm config set store-dir .pnpm-store
    # Install project dependencies
    - pnpm install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/
      - packages/*/node_modules/
    expire_in: 1 hour

# ── Stage 1: Seed ───────────────────────────────────────────
seed:
  stage: seed
  dependencies:
    - setup
  script:
    - npm install -g pnpm@$PNPM_VERSION
    - |
      sandforge seed \
        --config .sandforge.json \
        --template default \
        ${DRY_RUN:+--dry-run} \
        --output-format json \
        --output seed-report.json
  artifacts:
    paths:
      - seed-report.json
    expire_in: 7 days
    when: always
  rules:
    # Run on push to main
    - if: $CI_COMMIT_BRANCH == "main"
    # Run on manual trigger
    - if: $CI_PIPELINE_SOURCE == "web"
    # Run on schedule
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ── Stage 2: Sync ───────────────────────────────────────────
sync:
  stage: sync
  dependencies:
    - setup
    - seed
  script:
    - npm install -g pnpm@$PNPM_VERSION
    - |
      sandforge sync \
        --config .sandforge.json \
        --mode full \
        ${DRY_RUN:+--dry-run} \
        --output-format json \
        --output sync-report.json
  artifacts:
    paths:
      - sync-report.json
    expire_in: 7 days
    when: always

# ── Stage 3: Backup ─────────────────────────────────────────
backup:
  stage: backup
  dependencies:
    - setup
    - sync
  script:
    - npm install -g pnpm@$PNPM_VERSION
    - |
      sandforge backup \
        --config .sandforge.json \
        --org target \
        --output-format json \
        --output backup-report.json
  artifacts:
    paths:
      - backup-report.json
    expire_in: 7 days
    when: always

# ── Stage 4: Health Check ───────────────────────────────────
health-check:
  stage: health-check
  dependencies:
    - setup
    - sync
  script:
    - npm install -g pnpm@$PNPM_VERSION
    - |
      sandforge monitor health-check \
        --config .sandforge.json \
        --org target \
        --output-format json \
        --output health-report.json
  artifacts:
    paths:
      - health-report.json
    expire_in: 7 days
    when: always

# ── Stage 5: Report ─────────────────────────────────────────
report:
  stage: report
  dependencies:
    - setup
    - seed
    - sync
    - backup
    - health-check
  script:
    - npm install -g pnpm@$PNPM_VERSION
    - |
      sandforge report \
        --seed-report seed-report.json \
        --sync-report sync-report.json \
        --backup-report backup-report.json \
        --health-report health-report.json \
        --output-format html \
        --output pipeline-report.html
  artifacts:
    paths:
      - pipeline-report.html
    expire_in: 30 days
    when: always

  # Notify on pipeline failure
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ] && [ -n "$SLACK_WEBHOOK_URL" ]; then
        curl -X POST "$SLACK_WEBHOOK_URL" \
          -H 'Content-Type: application/json' \
          -d "{
            \"text\": \"SandForge Pipeline FAILED on $CI_PROJECT_NAME ($CI_COMMIT_REF_NAME)\",
            \"blocks\": [
              {
                \"type\": \"section\",
                \"text\": {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*SandForge Pipeline Failed*\n*Project:* $CI_PROJECT_NAME\n*Branch:* $CI_COMMIT_REF_NAME\n*Pipeline:* <$CI_PIPELINE_URL|View Pipeline>\"
                }
              }
            ]
          }"
      fi
