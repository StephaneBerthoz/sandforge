# SandForge — GitLab CI/CD Pipeline (EXAMPLE)
#
# Honest example built on what actually exists in this repo:
#   1. Quality gates   — pnpm validate (build:shared, typecheck, lint, tests, i18n, build)
#   2. Clone (dry-run) — packages/extension/cli/sandforge-clone.ts via tsx, its
#                        JSON summary saved to clone-summary.json
#   3. Removal (opt-in) — the same script with --remove clone-summary.json takes
#                        back what that clone created, and nothing else
#   4. VSIX package    — pnpm package, uploaded as an artifact
#   5. Notify          — Slack message when any job failed
#
# There is no installed `sandforge` command: each headless tool is a script of
# packages/extension/cli/, run with tsx from a checkout. See ci-examples/README.md.
#
# Prerequisites for the org-touching stages (clone and removal, dry-run default):
#   - CI/CD variables (masked):
#     - SFDX_AUTH_URL_SOURCE: sfdx auth URL of the source org
#     - SFDX_AUTH_URL_TARGET: sfdx auth URL of the target sandbox
#   - CI/CD variables:
#     - SANDFORGE_SF_ORGS: set to "true" to enable the clone job
#     - SF_CLONE_RECORD_ID: Salesforce record Id to clone (e.g. 500...)
#   - SLACK_WEBHOOK_URL (optional): failure notifications
#
# `main` below stands for your default branch; rename it if yours differs.

image: node:24

# Cache pnpm store across pipeline runs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .pnpm-store

variables:
  DRY_RUN: 'true'
  # "true" removes what a real clone created at the end of the clone job.
  REMOVE_AFTER: 'false'
  # "true" clones for real although flows or Apex triggers of the target fire
  # as the records are inserted: without it, such a clone writes nothing.
  ACCEPT_AUTOMATION: 'false'

stages:
  - quality
  - clone
  - package
  - notify

# ── Quality gates ────────────────────────────────────────────
quality:
  stage: quality
  script:
    # pnpm comes from the `packageManager` pin in package.json.
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    # Chains build:shared → typecheck → lint → test → check:i18n → build.
    # build:shared has to run first: the other packages import
    # @sandforge/shared from its dist/, so a bare `pnpm typecheck` on a fresh
    # checkout dies there. Split the script lines only with build:shared first.
    - pnpm validate
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ── Forge clone + removal (real CLI, dry-run default) ────────
clone:
  stage: clone
  script:
    - corepack enable
    - npm install -g @salesforce/cli
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm build:shared
    # Authenticate both orgs; the CLIs shell out to `sf org display`. The URLs
    # go to a private directory, removed once both logins are done, or by the
    # trap when the job's shell exits after a failed one: self-hosted runners
    # keep /tmp between jobs.
    - |
      umask 077
      auth_dir=$(mktemp -d)
      trap 'rm -rf "$auth_dir"' EXIT
      printf '%s' "$SFDX_AUTH_URL_SOURCE" > "$auth_dir/source.txt"
      printf '%s' "$SFDX_AUTH_URL_TARGET" > "$auth_dir/target.txt"
      sf org login sfdxurl --sfdx-url-file "$auth_dir/source.txt" --alias ci-source
      sf org login sfdxurl --sfdx-url-file "$auth_dir/target.txt" --alias ci-target
      rm -rf "$auth_dir"
    - |
      DRY_FLAG=""
      [ "$DRY_RUN" = "true" ] && DRY_FLAG="--dry-run"
      AUTOMATION_FLAG=""
      [ "$ACCEPT_AUTOMATION" = "true" ] && AUTOMATION_FLAG="--accept-automation"
      pnpm exec tsx packages/extension/cli/sandforge-clone.ts \
        --record "$SF_CLONE_RECORD_ID" \
        --source ci-source \
        --target ci-target \
        --upsert \
        $DRY_FLAG \
        $AUTOMATION_FLAG \
        --json \
        --remap-csv remap.csv \
        --audit clone-audit.json \
        > clone-summary.json
    # Your checks against the cloned records go here.
    #
    # Takes back what the clone created, from the summary it saved: never a
    # record the target already held, and not one changed since the clone (add
    # --include-changed when your checks change them). A dry run created
    # nothing and its summary is refused, so this runs after a real clone only.
    # What the removal wrote to the records it kept goes to
    # clone-summary.removals.json, which a later --remove of the same summary
    # reads: both are kept with the artifacts.
    - |
      if [ "$DRY_RUN" != "true" ] && [ "$REMOVE_AFTER" = "true" ]; then
        pnpm exec tsx packages/extension/cli/sandforge-clone.ts \
          --remove clone-summary.json \
          --target ci-target \
          --json \
          --audit clone-audit.json \
          > clone-removal.json
      fi
  artifacts:
    paths:
      - clone-summary.json
      - clone-summary.removals.json
      - clone-removal.json
      - clone-audit.json
      - remap.csv
    expire_in: 30 days
    when: always
  rules:
    # Only when sf org secrets and a record to clone have been configured
    - if: $SANDFORGE_SF_ORGS == "true" && $SF_CLONE_RECORD_ID

# ── VSIX package ─────────────────────────────────────────────
package:
  stage: package
  script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm package
  artifacts:
    paths:
      - sandforge.vsix
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ── Failure notification ─────────────────────────────────────
# A job of its own, so a failed quality or clone job is reported too: an
# after_script only ever sees the job it belongs to.
notify:
  stage: notify
  script:
    - |
      if [ -z "$SLACK_WEBHOOK_URL" ]; then
        echo "No SLACK_WEBHOOK_URL variable configured, skipping notification"
        exit 0
      fi
      curl -X POST "$SLACK_WEBHOOK_URL" \
        -H 'Content-Type: application/json' \
        -d "{\"text\": \"SandForge Pipeline FAILED on $CI_PROJECT_NAME ($CI_COMMIT_REF_NAME) — $CI_PIPELINE_URL\"}"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_failure
    - if: $CI_PIPELINE_SOURCE == "web"
      when: on_failure
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_failure
