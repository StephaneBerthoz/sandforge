# SandForge — GitLab CI/CD Pipeline (EXAMPLE)
#
# Honest example built on what actually exists in this repo:
#   1. Quality gates   — pnpm validate (build:shared, typecheck, lint, tests, i18n, build)
#   2. Clone (dry-run) — packages/extension/cli/sandforge-clone.ts via tsx
#   3. Cleanup (always dry-run) — packages/extension/cli/sandforge-cleanup.ts via tsx
#   4. VSIX package    — pnpm package, uploaded as an artifact
#   5. Notify          — Slack message when any job failed
#
# There is NO `sandforge seed|sync|backup|health` CLI — those stages exist
# only in the VSCode extension UI. See ci-examples/README.md for details.
#
# Prerequisites for the org-touching stages (clone/cleanup, dry-run default):
#   - CI/CD variables (masked):
#     - SFDX_AUTH_URL_SOURCE: sfdx auth URL of the source org
#     - SFDX_AUTH_URL_TARGET: sfdx auth URL of the target sandbox
#   - CI/CD variables:
#     - SANDFORGE_SF_ORGS: set to "true" to enable the clone/cleanup stages
#     - SF_CLONE_RECORD_ID: Salesforce record Id to clone (e.g. 500...)
#   - SLACK_WEBHOOK_URL (optional): failure notifications
#
# `main` below stands for your default branch; rename it if yours differs.

image: node:22

# Cache pnpm store across pipeline runs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .pnpm-store

variables:
  DRY_RUN: 'true'

stages:
  - quality
  - clone
  - package
  - notify

# ── Quality gates ────────────────────────────────────────────
quality:
  stage: quality
  script:
    # pnpm comes from the `packageManager` pin in package.json.
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    # Chains build:shared → typecheck → lint → test → check:i18n → build.
    # build:shared has to run first: the other packages import
    # @sandforge/shared from its dist/, so a bare `pnpm typecheck` on a fresh
    # checkout dies there. Split the script lines only with build:shared first.
    - pnpm validate
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ── Forge clone + cleanup (real CLIs, dry-run default) ───────
clone:
  stage: clone
  script:
    - corepack enable
    - npm install -g @salesforce/cli
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm build:shared
    # Authenticate both orgs; the CLIs shell out to `sf org display`. The URLs
    # go to a private directory, removed once both logins are done, or by the
    # trap when the job's shell exits after a failed one: self-hosted runners
    # keep /tmp between jobs.
    - |
      umask 077
      auth_dir=$(mktemp -d)
      trap 'rm -rf "$auth_dir"' EXIT
      printf '%s' "$SFDX_AUTH_URL_SOURCE" > "$auth_dir/source.txt"
      printf '%s' "$SFDX_AUTH_URL_TARGET" > "$auth_dir/target.txt"
      sf org login sfdxurl --sfdx-url-file "$auth_dir/source.txt" --alias ci-source
      sf org login sfdxurl --sfdx-url-file "$auth_dir/target.txt" --alias ci-target
      rm -rf "$auth_dir"
    - |
      DRY_FLAG=""
      [ "$DRY_RUN" = "true" ] && DRY_FLAG="--dry-run"
      pnpm exec tsx packages/extension/cli/sandforge-clone.ts \
        --record "$SF_CLONE_RECORD_ID" \
        --source ci-source \
        --target ci-target \
        --upsert \
        $DRY_FLAG \
        --json \
        --remap-csv remap.csv \
        > clone-summary.json
    # Always a preview, whatever DRY_RUN says: `--since today` matches every
    # record the CI user created today, not only the ones this clone wrote.
    # Run the real delete by hand once you have read the counts.
    - |
      pnpm exec tsx packages/extension/cli/sandforge-cleanup.ts \
        --target ci-target \
        --since today \
        --dry-run
  artifacts:
    paths:
      - clone-summary.json
      - remap.csv
    expire_in: 30 days
    when: always
  rules:
    # Only when sf org secrets and a record to clone have been configured
    - if: $SANDFORGE_SF_ORGS == "true" && $SF_CLONE_RECORD_ID

# ── VSIX package ─────────────────────────────────────────────
package:
  stage: package
  script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm package
  artifacts:
    paths:
      - sandforge.vsix
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ── Failure notification ─────────────────────────────────────
# A job of its own, so a failed quality or clone job is reported too: an
# after_script only ever sees the job it belongs to.
notify:
  stage: notify
  script:
    - |
      if [ -z "$SLACK_WEBHOOK_URL" ]; then
        echo "No SLACK_WEBHOOK_URL variable configured, skipping notification"
        exit 0
      fi
      curl -X POST "$SLACK_WEBHOOK_URL" \
        -H 'Content-Type: application/json' \
        -d "{\"text\": \"SandForge Pipeline FAILED on $CI_PROJECT_NAME ($CI_COMMIT_REF_NAME) — $CI_PIPELINE_URL\"}"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_failure
    - if: $CI_PIPELINE_SOURCE == "web"
      when: on_failure
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_failure
