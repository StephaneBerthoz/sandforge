# SandForge — GitLab CI/CD Pipeline (EXAMPLE)
#
# Honest example built on what actually exists in this repo:
#   1. Quality gates   — typecheck + unit tests + minified extension build
#   2. Clone (dry-run) — packages/extension/cli/sandforge-clone.ts via tsx
#   3. Cleanup (dry-run) — packages/extension/cli/sandforge-cleanup.ts via tsx
#   4. VSIX package    — pnpm package, uploaded as an artifact
#
# There is NO `sandforge seed|sync|backup|health` CLI — those stages exist
# only in the VSCode extension UI. See ci-examples/README.md for details.
#
# Prerequisites for the org-touching stages (clone/cleanup, dry-run default):
#   - CI/CD variables (masked):
#     - SFDX_AUTH_URL_SOURCE: sfdx auth URL of the source org
#     - SFDX_AUTH_URL_TARGET: sfdx auth URL of the target sandbox
#   - CI/CD variables:
#     - SANDFORGE_SF_ORGS: set to "true" to enable the clone/cleanup stages
#     - SF_CLONE_RECORD_ID: Salesforce record Id to clone (e.g. 500...)
#   - SLACK_WEBHOOK_URL (optional): failure notifications

image: node:22

# Cache pnpm store across pipeline runs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .pnpm-store

variables:
  PNPM_VERSION: "11"
  DRY_RUN: "true"

stages:
  - quality
  - clone
  - package

# ── Quality gates ────────────────────────────────────────────
quality:
  stage: quality
  script:
    - npm install -g pnpm@$PNPM_VERSION
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm typecheck
    - pnpm test
    - pnpm build:extension
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ── Forge clone + cleanup (real CLIs, dry-run default) ───────
clone:
  stage: clone
  script:
    - npm install -g pnpm@$PNPM_VERSION @salesforce/cli
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm build:shared
    # Authenticate both orgs; the CLIs shell out to `sf org display`.
    - echo "$SFDX_AUTH_URL_SOURCE" > /tmp/auth-source.txt
    - echo "$SFDX_AUTH_URL_TARGET" > /tmp/auth-target.txt
    - sf org login sfdxurl --sfdx-url-file /tmp/auth-source.txt --alias ci-source
    - sf org login sfdxurl --sfdx-url-file /tmp/auth-target.txt --alias ci-target
    - rm -f /tmp/auth-source.txt /tmp/auth-target.txt
    - |
      DRY_FLAG=""
      [ "$DRY_RUN" = "true" ] && DRY_FLAG="--dry-run"
      pnpm exec tsx packages/extension/cli/sandforge-clone.ts \
        --record "$SF_CLONE_RECORD_ID" \
        --source ci-source \
        --target ci-target \
        --upsert \
        $DRY_FLAG \
        --json \
        --remap-csv remap.csv \
        > clone-summary.json
    - |
      DRY_FLAG=""
      [ "$DRY_RUN" = "true" ] && DRY_FLAG="--dry-run"
      pnpm exec tsx packages/extension/cli/sandforge-cleanup.ts \
        --target ci-target \
        --since today \
        $DRY_FLAG
  artifacts:
    paths:
      - clone-summary.json
      - remap.csv
    expire_in: 30 days
    when: always
  rules:
    # Only when sf org secrets have been configured
    - if: $SANDFORGE_SF_ORGS == "true"

# ── VSIX package ─────────────────────────────────────────────
package:
  stage: package
  script:
    - npm install -g pnpm@$PNPM_VERSION
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm package
  artifacts:
    paths:
      - sandforge.vsix
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"

  # Notify on pipeline failure
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ] && [ -n "$SLACK_WEBHOOK_URL" ]; then
        curl -X POST "$SLACK_WEBHOOK_URL" \
          -H 'Content-Type: application/json' \
          -d "{\"text\": \"SandForge Pipeline FAILED on $CI_PROJECT_NAME ($CI_COMMIT_REF_NAME) — $CI_PIPELINE_URL\"}"
      fi
