# SandForge — GitHub Actions CI/CD Pipeline (EXAMPLE)
#
# Honest example built on what actually exists in this repo:
#   1. Quality gates   — pnpm validate (build:shared, typecheck, lint, tests, i18n, build)
#   2. Clone (dry-run) — packages/extension/cli/sandforge-clone.ts via tsx, its
#                        JSON summary saved to clone-summary.json
#   3. Removal (opt-in) — the same script with --remove clone-summary.json takes
#                        back what that clone created, and nothing else
#   4. VSIX package    — pnpm package, uploaded as an artifact
#
# There is no installed `sandforge` command: each headless tool is a script of
# packages/extension/cli/, run with tsx from a checkout. See ci-examples/README.md.
#
# Prerequisites for stages 2-3 (org-touching, dry-run by default):
#   - Repository secrets:
#     - SFDX_AUTH_URL_SOURCE: sfdx auth URL of the source org
#     - SFDX_AUTH_URL_TARGET: sfdx auth URL of the target sandbox
#   - Repository variables:
#     - SANDFORGE_SF_ORGS: set to 'true' to enable the clone stage
#     - SF_CLONE_RECORD_ID: Salesforce record Id to clone (e.g. 500...)
#   - SLACK_WEBHOOK_URL (optional secret): failure notifications
#
# `main` below stands for your default branch; rename it if yours differs.

name: SandForge Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the clone in dry-run mode (no data written)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      remove_after:
        description: 'Once a real clone is done, remove the records it created at the end of the job'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      accept_automation:
        description: 'Clone for real although flows or Apex triggers of the target fire as the records are inserted'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  schedule:
    - cron: '0 6 * * 1'

env:
  NODE_VERSION: '24'
  DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
  REMOVE_AFTER: ${{ github.event.inputs.remove_after || 'false' }}
  ACCEPT_AUTOMATION: ${{ github.event.inputs.accept_automation || 'false' }}

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # No `version:` — the action reads the `packageManager` pin in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm validate` chains build:shared → typecheck → lint → test →
      # check:i18n → build. Keeping it as one step is deliberate: build:shared
      # has to run first because every other package imports @sandforge/shared
      # from its dist/, and a bare `pnpm typecheck` on a fresh checkout dies
      # there before reaching a real error. Split the steps for finer reporting
      # only if `pnpm build:shared` stays in front.
      - name: Validate
        run: pnpm validate

  clone-dry-run:
    name: Forge clone (CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    # Only runs when the repo admin has configured sf org secrets and a record.
    if: vars.SANDFORGE_SF_ORGS == 'true' && vars.SF_CLONE_RECORD_ID != ''
    steps:
      - uses: actions/checkout@v4

      # No `version:` — the action reads the `packageManager` pin in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies and build shared
        run: |
          pnpm install --frozen-lockfile
          pnpm build:shared

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate source and target orgs
        env:
          SFDX_AUTH_URL_SOURCE: ${{ secrets.SFDX_AUTH_URL_SOURCE }}
          SFDX_AUTH_URL_TARGET: ${{ secrets.SFDX_AUTH_URL_TARGET }}
        # The URLs go to a private directory that is removed when this shell
        # exits, a failed login included — self-hosted runners keep /tmp.
        run: |
          umask 077
          auth_dir=$(mktemp -d)
          trap 'rm -rf "$auth_dir"' EXIT
          printf '%s' "$SFDX_AUTH_URL_SOURCE" > "$auth_dir/source.txt"
          printf '%s' "$SFDX_AUTH_URL_TARGET" > "$auth_dir/target.txt"
          sf org login sfdxurl --sfdx-url-file "$auth_dir/source.txt" --alias ci-source
          sf org login sfdxurl --sfdx-url-file "$auth_dir/target.txt" --alias ci-target

      - name: Clone record graph (sandforge-clone)
        env:
          SF_CLONE_RECORD_ID: ${{ vars.SF_CLONE_RECORD_ID }}
        run: |
          DRY_FLAG=""
          [ "$DRY_RUN" = "true" ] && DRY_FLAG="--dry-run"
          # A real clone writes nothing while the target runs flows or triggers
          # on insert, unless told to go on: see ci-examples/README.md.
          AUTOMATION_FLAG=""
          [ "$ACCEPT_AUTOMATION" = "true" ] && AUTOMATION_FLAG="--accept-automation"
          pnpm exec tsx packages/extension/cli/sandforge-clone.ts \
            --record "$SF_CLONE_RECORD_ID" \
            --source ci-source \
            --target ci-target \
            --upsert \
            $DRY_FLAG \
            $AUTOMATION_FLAG \
            --json \
            --remap-csv remap.csv \
            > clone-summary.json

      # Your checks against the cloned records go here.

      # Takes back what the clone created, from the summary it saved: never a
      # record the target already held, and not one changed since the clone
      # (add --include-changed when your checks change them). A dry run created
      # nothing and its summary is refused, so this runs after a real clone
      # only. What the removal wrote to the records it kept goes to
      # clone-summary.removals.json, which a later --remove of the same summary
      # reads: both are kept with the report.
      - name: Remove what the clone created (sandforge-clone --remove)
        if: env.DRY_RUN != 'true' && env.REMOVE_AFTER == 'true'
        run: |
          pnpm exec tsx packages/extension/cli/sandforge-clone.ts \
            --remove clone-summary.json \
            --target ci-target \
            --json \
            > clone-removal.json

      - name: Upload clone artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clone-report
          path: |
            clone-summary.json
            clone-summary.removals.json
            clone-removal.json
            remap.csv
          retention-days: 30

  package-vsix:
    name: Package VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4

      # No `version:` — the action reads the `packageManager` pin in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package VSIX
        run: pnpm package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: sandforge-vsix
          path: sandforge.vsix
          retention-days: 30

  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [quality, clone-dry-run, package-vsix]
    if: failure()
    steps:
      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "No SLACK_WEBHOOK_URL secret configured, skipping notification"
            exit 0
          fi
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\": \"SandForge Pipeline FAILED on ${{ github.repository }} (${{ github.ref_name }}) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
